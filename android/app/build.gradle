plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.facebook.react"
    id "com.google.gms.google-services"
}

android {
    namespace "com.zovexapp"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.zovexapp"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 41
        versionName "1.0.39"
    }

    signingConfigs {
        release {
            storeFile file(MYAPP_UPLOAD_STORE_FILE)
            storePassword MYAPP_UPLOAD_STORE_PASSWORD
            keyAlias MYAPP_UPLOAD_KEY_ALIAS
            keyPassword MYAPP_UPLOAD_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // נדרש ע"י media3-ffmpeg-decoder. ה-AAR מצהיר על זה במפורש
        // (coreLibraryDesugaringEnabled=true, desugarJdkLib>=1.1.5), ובלי זה
        // הבנייה נופלת ב-CheckAarMetadata — מה שקרה בבנייה 232.
        //
        // מה זה עושה: מאפשר להשתמש ב-API של Java 8+ (java.time, זרמים) גם
        // ב-minSdk 24, ע"י אריזת המימושים לתוך ה-APK.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation(platform("com.google.firebase:firebase-bom:32.7.4"))
    implementation("com.google.firebase:firebase-messaging")
    // נדרש כדי ש-CastOptionsProvider (במודול האפליקציה) יראה את מחלקות ה-Cast
    implementation("com.google.android.gms:play-services-cast-framework:21.3.0")

    // מפענחי FFmpeg ל-Media3 — אותה משפחת מפענחים ש-VLC משתמש בה, ולכן
    // ec-3 (Dolby Digital Plus) מתנגן גם במכשירים שאין בהם מפענח Dolby.
    // גוגל לא מפרסמת את ההרחבה הזאת בנויה; Jellyfin כן, ל-Maven Central.
    //
    // 1.3.1 בכוונה — זו גרסת media3 של react-native-video 6.4.5
    // (RNVideo_media3Version). התאמה בין השתיים היא חובה.
    //
    // אומת בתוך ה-AAR: ff_eac3_decoder, ff_ac3_decoder, ff_dca_decoder,
    // ff_truehd_decoder, ff_mlp_decoder, ff_aac_decoder. ~1.4MB ל-ABI.
    //
    // חייב לבוא יחד עם scripts/enable-ffmpeg-decoder.sh — בלעדיו
    // react-native-video מקבע EXTENSION_RENDERER_MODE_OFF ולא ייגע בזה.
    implementation("org.jellyfin.media3:media3-ffmpeg-decoder:1.3.1+2")
    // הצמד של coreLibraryDesugaringEnabled שלמעלה. ה-AAR דורש 1.1.5 ומעלה.
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation("org.webkit:android-jsc:+")
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

// play-services-cast-framework 22.x נבנה עם Kotlin 2.2 — המהדר שלנו (1.9)
// לא יכול לקרוא את מטא-הדאטה שלו. הדגל מדלג על בדיקת גרסת המטא-דאטה
// (הספרייה עצמה היא Java, לא צורכים ממנה Kotlin API שדורש את המטא-דאטה).
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
}
