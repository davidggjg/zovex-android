org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

android.useAndroidX=true
android.enableJetifier=true

MYAPP_UPLOAD_STORE_FILE=zovex-release.keystore
MYAPP_UPLOAD_STORE_PASSWORD=zovex2026
MYAPP_UPLOAD_KEY_ALIAS=zovex-key
MYAPP_UPLOAD_KEY_PASSWORD=zovex2026

newArchEnabled=false
hermesEnabled=true
reactNativeArchitectures=arm64-v8a,armeabi-v7a,x86,x86_64

# react-native-vlc-media-player מצהירה compileSdkVersion 35, ו-AGP 8.3.2
# תומך רשמית עד 34 ולכן עוצר בשגיאה. הדגל הופך אותה לאזהרה. האפליקציה
# עצמה נשארת על 34 — רק המודול של libVLC מהדר מול 35.
android.suppressUnsupportedCompileSdk=35
