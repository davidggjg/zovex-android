name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'לפרסם לקישור ההורדה הציבורי (latest)? בנייה מענף בדיקות לא אמורה'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      publish_tv:
        description: 'לפרסם ל-release Tv (base.apk)? ערוץ הבדיקות של הטלוויזיה, לא נוגע ב-latest'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      publish_test:
        description: 'לפרסם לערוץ בודקים (test/zovex-test.apk)? קישור ישיר לבודק, לא נוגע ב-latest ולא ב-Tv'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # שני מספרי גרסה, ואם הם נפרדים בדיקת העדכונים מתה בשקט:
      # UpdateDialog משווה את APP_VERSION שב-JS מול /app/version של השרת,
      # בעוד שמה שמותקן בפועל הוא versionName של גרדל. נמצא בפער —
      # gradle 1.0.43, JS 1.0.42, שרת 1.0.41 — ולכן כל משתמש קיבל
      # "אתה מעודכן" לנצח. עדיף שהבנייה תיפול מאשר שזה יחזור בשקט.
      - name: Check version numbers agree
        run: |
          G=$(grep -m1 'versionName' android/app/build.gradle | tr -d '"' | awk '{print $2}')
          J=$(grep -m1 "APP_VERSION = " src/api/movies.js | sed "s/.*'\\(.*\\)'.*/\\1/")
          echo "gradle=$G  js=$J"
          if [ "$G" != "$J" ]; then
            echo "❌ versionName ($G) ו-APP_VERSION ($J) לא זהים."
            echo "   בלי התאמה דיאלוג העדכון לא יציע לאף אחד לעדכן."
            exit 1
          fi
          echo "✓ תואמים"

      - name: Install dependencies
        run: npm install

      # npm install דורס את node_modules, ולכן זה חייב לרוץ אחריו ולפני
      # הבנייה. הסקריפט נופל בקול אם השורה שהוא מחפש כבר לא שם.
      - name: Enable Media3 FFmpeg decoder (ec-3 / Dolby)
        run: bash scripts/enable-ffmpeg-decoder.sh

      # גם זה חייב לרוץ אחרי npm install. בלעדיו האפליקציה קורסת בלחיצה על
      # פליי: החבילה קוראת src.getBoolean("autoplay") על מפתח שלא קיים.
      - name: Fix libVLC crash on play (missing autoplay key)
        run: bash scripts/fix-vlc-autoplay-crash.sh

      - name: Ensure gradle-plugin at top-level node_modules
        run: |
          PLUGIN_DIR="node_modules/@react-native/gradle-plugin"

          echo "=== @react-native scope ==="
          ls node_modules/@react-native/ 2>/dev/null || echo "(empty or missing)"

          echo "=== find gradle-plugin ==="
          find node_modules -path "*/@react-native/gradle-plugin" -type d 2>/dev/null | head -5

          if [ ! -d "$PLUGIN_DIR" ]; then
            NESTED=$(find node_modules -path "*/@react-native/gradle-plugin" -type d 2>/dev/null | head -1)
            if [ -n "$NESTED" ]; then
              mkdir -p node_modules/@react-native
              cp -r "$NESTED" node_modules/@react-native/gradle-plugin
              echo "Copied $NESTED -> $PLUGIN_DIR"
            else
              echo "ERROR: @react-native/gradle-plugin not found anywhere"
              exit 1
            fi
          fi

          echo "=== $PLUGIN_DIR top-level ==="
          ls -1 "$PLUGIN_DIR/" 2>/dev/null

          echo "=== build files ==="
          for f in build.gradle.kts build.gradle settings.gradle settings.gradle.kts; do
            [ -f "$PLUGIN_DIR/$f" ] && echo "FOUND: $f" || echo "MISSING: $f"
          done

          echo "=== build.gradle.kts ==="
          cat "$PLUGIN_DIR/build.gradle.kts" 2>/dev/null || echo "(not found)"

          echo "=== gradle/ dir ==="
          ls "$PLUGIN_DIR/gradle/" 2>/dev/null || echo "(no gradle/ dir)"

          echo "=== gradle/libs.versions.toml ==="
          cat "$PLUGIN_DIR/gradle/libs.versions.toml" 2>/dev/null || echo "(not found)"

          # Add settings.gradle if missing
          if [ ! -f "$PLUGIN_DIR/settings.gradle" ] && [ ! -f "$PLUGIN_DIR/settings.gradle.kts" ]; then
            echo "rootProject.name = 'react-native-gradle-plugin'" > "$PLUGIN_DIR/settings.gradle"
            echo "Created settings.gradle"
          fi

      # packages: '' מדלג על התקנת ברירת המחדל של הפעולה. ברירת המחדל שלה
      # היא "tools platform-tools", וגוגל הסירה את החבילה tools ממאגר ה-SDK
      # — כך שכל בנייה נפלה ב-sdkmanager עוד לפני ההידור. מה שבאמת נדרש
      # מותקן במפורש בשלב הבא, אז אין מה לאבד.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate app icons
        run: |
          pip install Pillow --quiet
          python3 -c "
          from PIL import Image, ImageDraw
          import os
          if os.path.exists('assets/icon.png'):
              src = Image.open('assets/icon.png').convert('RGBA')
          else:
              src = Image.new('RGBA', (512, 512), (10, 10, 10, 255))
              draw = ImageDraw.Draw(src)
              draw.ellipse([80, 80, 432, 432], fill=(200, 0, 0, 255))
          sizes = {
              'android/app/src/main/res/mipmap-mdpi': 48,
              'android/app/src/main/res/mipmap-hdpi': 72,
              'android/app/src/main/res/mipmap-xhdpi': 96,
              'android/app/src/main/res/mipmap-xxhdpi': 144,
              'android/app/src/main/res/mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              os.makedirs(folder, exist_ok=True)
              ratio = max(size / src.width, size / src.height)
              new_w, new_h = int(src.width * ratio), int(src.height * ratio)
              scaled = src.resize((new_w, new_h), Image.LANCZOS)
              x, y = (new_w - size) // 2, (new_h - size) // 2
              icon = scaled.crop((x, y, x + size, y + size))
              out = icon.convert('RGB')
              out.save(f'{folder}/ic_launcher.png')
              mask = Image.new('L', (size, size), 0)
              ImageDraw.Draw(mask).ellipse([0, 0, size-1, size-1], fill=255)
              result = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              result.paste(icon, mask=mask)
              result.save(f'{folder}/ic_launcher_round.png')
          print('Icons created!')
          "

      - name: Restore Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/zovex-release.keystore

      - name: Print SHA256 fingerprint for Android App Links (assetlinks.json)
        run: |
          echo "=== Release keystore SHA256 (for assetlinks.json - see docs/app-links-setup.md) ==="
          SHA256=$(keytool -list -v -keystore android/app/zovex-release.keystore -alias zovex-key -storepass zovex2026 2>/dev/null | grep "SHA256:" | sed 's/.*SHA256: //')
          echo "SHA256: $SHA256"
          echo ""
          echo "Paste this into davidggjg.github.io/.well-known/assetlinks.json :"
          echo "----------------------------------------------------------------"
          cat <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.zovexapp",
                "sha256_cert_fingerprints": ["$SHA256"]
              }
            }
          ]
          EOF
          echo "----------------------------------------------------------------"

      - name: Register release SHA-1 with Firebase and fetch google-services.json
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          pip install google-auth --quiet
          python3 scripts/register_sha.py

      - name: Apply iOS OAuth client ID to source files
        run: |
          if [ -f ios_oauth.txt ]; then
            IOS_CLIENT_ID=$(sed -n '1p' ios_oauth.txt | tr -d '[:space:]')
            IOS_SCHEME=$(sed -n '2p' ios_oauth.txt | tr -d '[:space:]')
            echo "iOS CLIENT_ID: $IOS_CLIENT_ID"
            echo "iOS scheme:    $IOS_SCHEME"
            sed -i "s|IOS_CLIENT_ID_PLACEHOLDER|${IOS_CLIENT_ID}|g" src/App.js
            sed -i "s|IOS_SCHEME_PLACEHOLDER|${IOS_SCHEME}|g" android/app/src/main/AndroidManifest.xml
            echo "Applied iOS OAuth client ID to App.js and AndroidManifest.xml"
          else
            echo "WARNING: ios_oauth.txt not found — building with placeholder values (sign-in will not work)"
          fi

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zovex-release-apk
          path: android/app/build/outputs/apk/release/app-universal-release.apk
          retention-days: 30

      # דריסת ה-release בשם latest מחליפה את ה-APK שכל המשתמשים מורידים.
      # בנייה מענף פיתוח אמורה לייצר artifact לבדיקה, לא להחליף לכולם את
      # האפליקציה בקוד שטרם נבדק. לכן הפרסום מותנה: אוטומטי רק מ-main,
      # ומענף אחר רק בבחירה מפורשת.
      - name: Publish APK to GitHub Release (stable public download link)
        if: github.ref == 'refs/heads/main' || inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # אוניברסלי: אף משתמש קיים לא נשבר בגלל ארכיטקטורה
          cp android/app/build/outputs/apk/release/app-universal-release.apk zovex.apk
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest zovex.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create latest zovex.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "ZOVEX - הגרסה העדכנית ביותר" \
              --notes "קובץ ה-APK העדכני ביותר. הקישור הזה מתעדכן אוטומטית עם כל build חדש."
          fi
          echo "Public download URL: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/zovex.apk"

      # מסלול נפרד לבדיקות טלוויזיה. התקנה על טלוויזיה דרך artifact של
      # Actions היא סיזיפית — היא דורשת התחברות לגיטהאב ופתיחת zip, ואין
      # דפדפן נוח על המסך. לכן בנייה לבדיקה יכולה להתפרסם ל-release בשם Tv,
      # שנותן כתובת ציבורית ישירה שכל טלוויזיה יודעת להוריד — בלי לגעת
      # ב-latest, שהוא ה-APK שכל המשתמשים הקיימים מורידים.
      # שם האסֶט נשאר base.apk בכוונה: זו הכתובת שכפתור הטלוויזיה באתר
      # מצביע אליה, ולכן היא חייבת להישאר יציבה בין בניות.
      - name: Publish APK to the Tv release (TV test channel)
        if: inputs.publish_tv == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # אוניברסלי, כמו הערוץ הציבורי. וריאנט פר-ארכיטקטורה חסך ~30MB
          # אבל יצר בלבול אמיתי: שלושה קבצים עם אותו versionCode, שאנדרואיד
          # מסרב להתקין אחד מעל השני, ווריאנט לא מתאים קורס. בהפצה ידנית
          # קובץ אחד שעובד בכל מקום שווה יותר מ-30MB.
          cp android/app/build/outputs/apk/release/app-universal-release.apk base.apk
          if gh release view Tv --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload Tv base.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create Tv base.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "ZOVEX - גרסת טלוויזיה" \
              --notes "APK לבדיקה על Android TV. מתעדכן בכל בנייה עם publish_tv."
          fi
          echo "TV download URL: https://github.com/$GITHUB_REPOSITORY/releases/download/Tv/base.apk"

      # ערוץ בודקים. הצורך: לתת לאדם אחד קישור הורדה ישיר בלי שאיש אחר
      # יקבל את הגרסה. artifact של Actions לא מתאים — הוא דורש חשבון גיטהאב
      # והוצאה מ-zip; latest ו-Tv שניהם ציבוריים ומחוברים לכפתורים באתר.
      #
      # ‎--prerelease אינו קישוט: /app/version בשרת מצביע על
      # ‎releases/latest/download/... ‏, וגיטהאב מחשב "latest" לפי ה-release
      # הלא-prerelease החדש ביותר. בלי הדגל הזה כל בנייה לבדיקה הייתה הופכת
      # ל"האחרונה" עבור גיטהאב.
      - name: Publish APK to the test release (tester channel)
        if: inputs.publish_test == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-universal-release.apk zovex-test.apk
          if gh release view test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload test zovex-test.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create test zovex-test.apk \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "ZOVEX - גרסת בדיקה" \
              --notes "APK לבדיקה בלבד. הכתובת קבועה ומתעדכנת בכל בנייה עם publish_test. אינו מגיע למשתמשים."
          fi
          gh release edit test --repo "$GITHUB_REPOSITORY" --prerelease
          echo "Tester download URL: https://github.com/$GITHUB_REPOSITORY/releases/download/test/zovex-test.apk"
